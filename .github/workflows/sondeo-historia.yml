name: sondeo-historia
on:
  push:
    branches: [historial-largo]
    paths: [".github/workflows/sondeo-historia.yml", "scripts/sondeo.sh"]
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/sondeo.sh > sondeo.txt 2>&1 || true
      - run: |
          mkdir -p tmp_sondeo && mv sondeo.txt tmp_sondeo/ && cp -r sondeo_files tmp_sondeo/ 2>/dev/null || true
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp_sondeo && git commit -m "resultado sondeo" && git push
