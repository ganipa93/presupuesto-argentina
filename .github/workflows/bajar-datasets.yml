name: Bajar datasets oficiales

# Se corre a mano desde la pestaña Actions. Baja los datasets con el detalle por
# programa (ONP y Presupuesto Abierto), los guarda en fuentes/datasets/ y rearma
# el buscador /programas.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bajar
        env:
          PRESUPUESTO_ABIERTO_TOKEN: ${{ secrets.PRESUPUESTO_ABIERTO_TOKEN }}
        run: python3 scripts/bajar_datasets.py
      - name: Armar el buscador por programa
        run: |
          pip install --quiet openpyxl
          python3 scripts/armar_programas.py
          python3 scripts/build.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuentes/datasets datos/programas.json programas.html
          git diff --cached --quiet || git commit -m "Bajar datasets oficiales por programa"
          git push
