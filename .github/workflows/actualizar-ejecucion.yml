name: Actualizar datos a diario

# Corre todos los días a las 10:17 de Argentina (Presupuesto Abierto se actualiza a diario;
# la recaudación, el IPC y el dólar se suman cuando salen). Solo publica si algún dato cambió. También se puede correr a mano desde Actions.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      ejercicio:
        description: "Año a actualizar (vacío = año en curso)"
        required: false

permissions:
  contents: write

concurrency:
  group: actualizar-ejecucion
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04  # fijo: Playwright todavía no soporta Ubuntu 26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bajar la ejecución de Presupuesto Abierto
        env:
          PRESUPUESTO_ABIERTO_TOKEN: ${{ secrets.PRESUPUESTO_ABIERTO_TOKEN }}
        run: python3 scripts/actualizar_ejecucion.py ${{ github.event.inputs.ejercicio }}

      - name: Bajar la ejecución por programa y armar el buscador
        continue-on-error: true  # si falla, igual se publica la ejecución por ministerio
        env:
          PRESUPUESTO_ABIERTO_TOKEN: ${{ secrets.PRESUPUESTO_ABIERTO_TOKEN }}
        run: |
          pip install --quiet openpyxl
          if [ -z "${{ github.event.inputs.ejercicio }}" ] || [ "${{ github.event.inputs.ejercicio }}" = "2026" ]; then
            python3 scripts/bajar_datasets.py --solo-api && python3 scripts/armar_programas.py
          fi

      - name: Bajar recaudación, inflación y dólar (datos.gob.ar)
        continue-on-error: true
        run: python3 scripts/bajar_series.py

      - name: Ver si cambió algo
        id: cambios
        run: |
          git status --porcelain -- datos/ fuentes/ipc_indec.json
          if [ -z "$(git status --porcelain -- datos/ fuentes/ipc_indec.json)" ]; then echo "hay=no" >> "$GITHUB_OUTPUT"; else echo "hay=si" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v5
        if: steps.cambios.outputs.hay == 'si'
        with:
          node-version: "22"

      - name: Rearmar el sitio
        if: steps.cambios.outputs.hay == 'si'
        run: |
          export FECHA_SITIO=$(TZ=America/Argentina/Buenos_Aires date +%F)
          python3 scripts/build.py
          cd scripts && npm ci && npx playwright install --with-deps chromium && cd ..
          node scripts/prerender.mjs

      - name: Probar antes de publicar
        if: steps.cambios.outputs.hay == 'si'
        run: |
          python3 scripts/revisar_sitio.py
          mkdir -p /tmp/capturas && node scripts/test-local.mjs /tmp/capturas && node scripts/test-programas.mjs /tmp/capturas

      - name: Publicar
        if: steps.cambios.outputs.hay == 'si'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A datos fuentes/datasets fuentes/ipc_indec.json *.html que-me-cambia gasto provincias embed og js novedades.xml sitemap.xml
          git commit -m "Actualizar datos ($(TZ=America/Argentina/Buenos_Aires date +%F))"
          git pull --rebase --autostash
          git push
