name: Bajar presupuestos desde 1995

# Baja de Presupuesto Abierto la ley, el vigente y lo gastado de cada año desde 1995 (por finalidad,
# función, tipo de gasto y jurisdicción) y las series de PIB y gasto público de datos.gob.ar.
# Corre solo una vez por mes (año anterior y actual) y se puede correr a mano desde Actions.
on:
  schedule:
    - cron: "43 9 6 * *"  # día 6 de cada mes: actualiza el año anterior y el actual
  workflow_dispatch:
    inputs:
      desde: {description: "Primer año", required: false, default: "1995"}

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: Bajar
        env:
          PRESUPUESTO_ABIERTO_TOKEN: ${{ secrets.PRESUPUESTO_ABIERTO_TOKEN }}
        run: |
          D="${{ github.event.inputs.desde }}"
          [ -z "$D" ] && D=$(( $(date +%Y) - 1 ))
          python3 scripts/bajar_historia_larga.py "$D"
      - name: Armar datos/historia.json
        run: python3 scripts/armar_historia.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuentes/historia_larga datos/historia.json
          git diff --cached --quiet || git commit -m "Bajar presupuestos desde 1995" -m "El sitio se rearma en la próxima actualización diaria."
          git push
