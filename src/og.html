<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8">
<link rel="stylesheet" href="/estilos.css">
<style>
html,body{margin:0;width:1200px;height:630px}
body{background:#0B1220;color:#fff;font-family:"Source Sans 3",system-ui,sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:64px 72px;box-sizing:border-box}
.kick{font-size:26px;letter-spacing:.06em;text-transform:uppercase;color:#FF8A3D;font-weight:600}
h1{font-family:"Space Grotesk",sans-serif;font-weight:700;letter-spacing:-.02em;font-size:76px;line-height:1.05;margin:18px 0 0}
.stats{display:flex;gap:28px}
.s{flex:1;border-top:3px solid #FF8A3D;padding-top:14px}
.s b{display:block;font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:46px}
.s span{font-size:22px;color:#C9D1E3}
.foot{display:flex;justify-content:space-between;font-size:22px;color:#AEB8CE}
</style></head>
<body>
<div><div class="kick">Presupuesto Argentina</div><h1>Presupuesto 2027:<br>¿qué te cambia a vos?</h1></div>
<div class="stats">
<div class="s"><b>{{GASTO}} billones</b><span>de gasto previsto para 2027</span></div>
<div class="s"><b>{{INFL}}% inflación</b><span>supone el proyecto para 2027</span></div>
<div class="s"><b>{{OBRAS}} obras</b><span>nacionales canceladas o en rescisión</span></div>
</div>
<div class="foot"><span>Jubilados · AUH · universidades · tarifas · provincias</span><span>{{HOST}}</span></div>
</body></html>
