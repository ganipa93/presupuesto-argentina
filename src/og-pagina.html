<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8">
<link rel="stylesheet" href="/estilos.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#0B1220;color:#fff;font-family:"Source Sans 3",system-ui,sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:60px 72px;box-sizing:border-box}
.kick{font-size:24px;letter-spacing:.07em;text-transform:uppercase;color:#FF8A3D;font-weight:600}
h1{font-family:"Space Grotesk",sans-serif;font-weight:700;letter-spacing:-.02em;font-size:54px;line-height:1.08;margin:14px 0 0;color:#fff;letter-spacing:-.01em;max-width:1050px}
.org{font-size:26px;color:#C9D1E3;margin-top:10px}
.fila{display:flex;gap:56px;align-items:flex-end}
.n{font-family:"Space Grotesk",sans-serif;font-weight:700;letter-spacing:-.02em;font-size:76px;line-height:1}
.n small{font-family:"Source Sans 3",sans-serif;font-size:28px;color:#C9D1E3}
.l{font-size:22px;color:#C9D1E3;margin-bottom:6px}
.b{border-left:3px solid rgba(255,255,255,.25);padding-left:24px}
.b .n{font-size:46px}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:22px;color:#C9D1E3;border-top:3px solid #FF8A3D;padding-top:16px}
.foot b{color:#fff;font-weight:600}
</style></head>
<body>
<div><div class="kick" id="k"></div><h1 id="t"></h1><div class="org" id="o"></div></div>
<div class="fila"><div><div class="l" id="l1"></div><div class="n" id="n1"></div></div><div class="b" id="bx"><div class="l" id="l2"></div><div class="n" id="n2"></div></div></div>
<div class="foot"><b>presupuesto-argentina.vercel.app</b><span id="f"></span></div>
<script>
// d = {kicker, titulo, org, l1, n1, u1, l2, n2, u2, fuente}
window.pintar = (d) => {
  const $ = (i) => document.getElementById(i);
  $('k').textContent = d.kicker || ''; $('t').textContent = d.titulo; $('o').textContent = d.org || '';
  $('t').style.fontSize = d.titulo.length > 70 ? '42px' : d.titulo.length > 45 ? '48px' : '54px';
  $('l1').textContent = d.l1 || ''; $('n1').replaceChildren(d.n1 || '', ' ', Object.assign(document.createElement('small'), {textContent: d.u1 || ''}));
  $('bx').hidden = !d.n2; $('l2').textContent = d.l2 || ''; $('n2').replaceChildren(d.n2 || '', ' ', Object.assign(document.createElement('small'), {textContent: d.u2 || ''}));
  $('f').textContent = d.fuente || 'Fuente: Presupuesto 2027 y Ley 27.798';
};
</script>
</body></html>
